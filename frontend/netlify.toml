# Netlify configuration for VaultKey frontend
[build]
  command = "npm run build"
  publish = "dist"

# SPA routing - redirect all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Allow Firebase OAuth popups to communicate back to this page.
    # "same-origin-allow-popups" lets popups opened from this origin (Firebase auth)
    # use window references without being blocked by COOP.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
